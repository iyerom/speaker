<!DOCTYPE html>
<html>
<head>
  <title>uhmb</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 30px;
    }

    #row {
      display: flex;
      gap: 24px;
      margin-top: 20px;
      width: 95%;
      max-width: 1440px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 30px;
      font-size: 42px;
      background: #1a1a1a;
      color: white;
      border: 3px solid #444;
      border-radius: 18px;
    }

    button {
      padding: 24px 42px;
      font-size: 42px;
      background: #333;
      color: white;
      border: 3px solid #555;
      border-radius: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #status {
      margin-top: 24px;
      font-size: 24px;
      opacity: 0.8;
      min-height: 30px;
    }
  </style>
</head>

<body>

<div id="row">
  <input id="msg" maxlength="240" placeholder="write anything" autocomplete="off">
  <button id="sendBtn">send</button>
</div>
<div id="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCkjHTbcxY5Xnv_vr1GvOZoI7Q5juQBl-U",
  databaseURL: "https://pixelpost-b0450-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const input = document.getElementById("msg");
const btn = document.getElementById("sendBtn");
const status = document.getElementById("status");

async function send() {
  const text = input.value.trim();
  if (!text) return;

  btn.disabled = true;
  try {
    await set(ref(db, "message"), text);
    input.value = "";
    status.textContent = "sent";
  } catch (e) {
    status.textContent = "failed";
  }
  btn.disabled = false;
}

btn.onclick = send;
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") send();
});
</script>

</body>
</html>
