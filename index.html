<!DOCTYPE html>
<html>
<head>
  <title>uhmb</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 30px;
    }

    #row {
      display: flex;
      gap: 24px;
      margin-top: 20px;
      width: 95%;
      max-width: 1440px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 30px;
      font-size: 42px;
      background: #1a1a1a;
      color: white;
      border: 3px solid #444;
      border-radius: 18px;
    }

    #name { flex: 1; }
    #msg  { flex: 3; }

    button {
      padding: 24px 42px;
      font-size: 42px;
      background: #333;
      color: white;
      border: 3px solid #555;
      border-radius: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #log {
      width: 95%;
      max-width: 1440px;
      height: 35vh;
      overflow-y: auto;
      margin-top: 24px;
      padding: 16px;
      box-sizing: border-box;
      border: 3px solid #1a1a1a;
      border-radius: 18px;
      background: #444;
      font-size: 26px;
    }

    .entry {
      padding: 12px 0;
      word-wrap: break-word;
    }

    .time {
      opacity: 0.5;
      font-size: 18px;
      margin-right: 12px;
    }

    .who {
      margin-right: 12px;
    }

    #status {
      margin-top: 24px;
      font-size: 24px;
      opacity: 0.8;
      min-height: 30px;
    }
  </style>
</head>

<body>

<div id="row">
  <input id="name" maxlength="30" placeholder="name" autocomplete="off">
  <input id="msg" maxlength="240" placeholder="write anything" autocomplete="off">
  <button id="sendBtn">send</button>
</div>
<div id="status"></div>
<div id="log"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getDatabase, ref, push, update, get, query,
  orderByKey, limitToLast, onValue, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCkjHTbcxY5Xnv_vr1GvOZoI7Q5juQBl-U",
  databaseURL: "https://pixelpost-b0450-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const nameInput = document.getElementById("name");
const input = document.getElementById("msg");
const btn = document.getElementById("sendBtn");
const status = document.getElementById("status");
const logDiv = document.getElementById("log");

const LOG_MAX = 10;

try { nameInput.value = localStorage.getItem("name") || ""; } catch (e) {}

async function trimLog() {
  const snap = await get(query(ref(db, "spLog"), orderByKey(), limitToLast(LOG_MAX + 10)));
  const keys = [];
  snap.forEach((c) => { keys.push(c.key); });
  const extra = keys.slice(0, Math.max(0, keys.length - LOG_MAX));
  if (!extra.length) return;
  const updates = {};
  extra.forEach((k) => { updates["spLog/" + k] = null; });
  await update(ref(db), updates);
}

async function send() {
  const text = input.value.trim();
  if (!text) return;

  const name = nameInput.value.replace(/:/g, "").trim() || "";
  try { localStorage.setItem("name", name); } catch (e) {}

  btn.disabled = true;
  try {
    const key = push(ref(db, "spLog")).key;
    await update(ref(db), {
      "message": name + ":" + text,
      ["spLog/" + key]: { name, text, ts: serverTimestamp() }
    });
    input.value = "";
    status.textContent = "sent";
  } catch (e) {
    status.textContent = "failed";
    btn.disabled = false;
    return;
  }
  btn.disabled = false;

  try { await trimLog(); } catch (e) { console.log("trim failed", e); }
}

onValue(query(ref(db, "spLog"), orderByKey(), limitToLast(LOG_MAX)), (snap) => {
  const atBottom = logDiv.scrollTop + logDiv.clientHeight >= logDiv.scrollHeight - 30;
  logDiv.textContent = "";
  snap.forEach((c) => {
    const v = c.val();
    const row = document.createElement("div");
    row.className = "entry";


    const who = document.createElement("span");
    who.className = "who";
    who.textContent = v.name+":";

    const what = document.createElement("span");
    what.textContent = v.text;

    row.append(who, what);
    logDiv.appendChild(row);
  });
  if (atBottom) logDiv.scrollTop = logDiv.scrollHeight;
});

btn.onclick = send;
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") send();
});
</script>

</body>
</html>
